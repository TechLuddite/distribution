name: Build Portal audio submission artifacts

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: justinthelaw/maximize-github-runner-space@v0.9.0
        with:
          skip-components: docker-engine
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          repository: ROCKNIX/distribution
          run-id: 38842718916
          name: aarch64 (SM8550)
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          repository: ROCKNIX/distribution
          run-id: 38842718916
          name: aarch64 build (SM8550)
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          repository: ROCKNIX/distribution
          run-id: 38842718916
          name: ROCKNIX-base-image-SM8550-20261016
          path: public-baseline
          github-token: ${{ github.token }}
      - name: Verify auditor against public upstream image
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y squashfs-tools mtools e2fsprogs fdisk
          mkdir public-fixture
          cp public-baseline/*.img.gz public-fixture/
          sudo python3 .github/scripts/audit-portal-artifacts.py public-fixture public-baseline --public-fixture > public-fixture-audit.txt
          sudo rm -rf public-fixture
      - name: Restore public upstream build cache
        run: |
          tar -xf build.aarch64.tar
          tar -xf build.build.aarch64.tar
          rm build.aarch64.tar build.build.aarch64.tar
          curl -fL --retry 3 https://github.com/ROCKNIX/distribution-cache/releases/download/ccache/ccache-aarch64-SM8550.tar | tar -xf -
      - name: Rebuild audio packages and base image
        run: |
          docker run --init --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:$PWD" -w "$PWD" \
            -e PROJECT=ROCKNIX -e DEVICE=SM8550 -e ARCH=aarch64 \
            -e EMULATION_DEVICE=no -e ENABLE_32BIT=no -e MODULES_PKG=no \
            -e AUTOREMOVE=yes -e NIGHTLY=no -e OFFICIAL=no \
            -e DISABLE_COLORS=yes -e CONCURRENCY_MAKE_LEVEL=4 \
            -e CCACHE_COMPILERCHECK=content -e CCACHE_COMPRESS=1 \
            -e CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime \
            ghcr.io/rocknix/rocknix-build:latest \
            bash -c './scripts/clean linux && ./scripts/clean alsa-ucm-conf && ./scripts/build_distro' \
            > build-portal-audio.log 2>&1 || { tail -100 build-portal-audio.log; exit 1; }
      - name: Save encrypted recovery copy
        run: |
          tar -cf - target/ROCKNIX-*.img.gz target/ROCKNIX-*.tar \
            | openssl cms -encrypt -binary -aes-256-cbc -outform DER \
                -stream -out portal-build-recovery.cms .github/portal-recovery-cert.pem
      - name: Audit finished artifacts before upload
        run: |
          sudo python3 .github/scripts/audit-portal-artifacts.py target public-baseline > artifact-audit.txt
      - uses: actions/upload-artifact@v7
        with:
          name: Portal-audio-reviewed-artifacts
          path: |
            target/ROCKNIX-*.img.gz
            target/ROCKNIX-*.img.gz.sha256
            target/ROCKNIX-*.tar
            target/ROCKNIX-*.tar.sha256
            artifact-audit.txt
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: Portal-encrypted-recovery
          path: portal-build-recovery.cms
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 7
